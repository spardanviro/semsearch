[project]
name = "semsearch"
version = "0.1.0"
description = "Local semantic code search for Claude Code, powered by EmbeddingGemma 2"
readme = "README.md"
# 3.12 only: the CUDA 13 torch wheels and tree-sitter-language-pack were verified on it
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nero" }]
dependencies = [
    "torch>=2.14",
    "torchvision",              # not imported, but EmbeddingGemma's image processor needs it
    "pillow",
    "sentence-transformers>=6.1",
    "transformers",
    "numpy",
    "tree-sitter",
    "tree-sitter-language-pack",
    "blake3",
    "pathspec>=1.1",            # backend selection (RE2) used by semsearch.globs
    "google-re2>=1.1.20251105", # linear-time matching of untrusted ignore patterns
    "fastapi",
    "pydantic>=2",
    "uvicorn",
    "httpx",
    "anyio",
    "mcp>=2,<3",                # mcp.server.mcpserver.MCPServer (2.x API)
    "pypdfium2>=5.14.0",
    "av>=19.0.2",
]

[project.urls]
Homepage = "https://github.com/spardanviro/semsearch"

[project.scripts]
semsearch = "semsearch.cli:main"
semsearchd = "semsearch.daemon.__main__:main"
semsearch-mcp = "semsearch.mcp_server:main"
semsearch-hook = "semsearch.hook:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semsearch"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "pyright", "sqlite-vec"]  # sqlite-vec: only for spikes/phase0_infra.py

[tool.uv]
package = true

# CUDA 13 builds (NVIDIA driver >= 580) on Windows/Linux; macOS gets the regular PyPI wheels
[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs the real EmbeddingGemma 2 model on CUDA (set SEMSEARCH_GPU_TESTS=1)"]

[tool.coverage.run]
source = ["src/semsearch"]

[tool.coverage.report]
fail_under = 85

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"spikes/*" = ["E501"]   # benchmark corpus strings
