[project]
name = "semsearch"
version = "0.1.0"
description = "Local semantic code search for Claude Code, powered by EmbeddingGemma 2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.14",
    "torchvision",
    "pillow",
    "sentence-transformers>=6.1",
    "transformers",
    "numpy",
    "tree-sitter-language-pack",
    "blake3",
    "pathspec",
    "fastapi",
    "uvicorn",
    "httpx",
    "mcp",
]

[project.scripts]
semsearch = "semsearch.cli:main"
semsearchd = "semsearch.daemon.__main__:main"
semsearch-mcp = "semsearch.mcp_server:main"
semsearch-hook = "semsearch.hook:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semsearch"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "sqlite-vec"]  # sqlite-vec: only for spikes/phase0_infra.py

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs the real EmbeddingGemma 2 model on CUDA (set SEMSEARCH_GPU_TESTS=1)"]

[tool.coverage.run]
source = ["src/semsearch"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"spikes/*" = ["E501"]   # benchmark corpus strings
